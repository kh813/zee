name: Extended Support Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Target Release Tag (e.g. v0.1.11). Leave empty to use latest git tag."
        required: false
        default: ""
      build_linux_gui:
        description: "Build Linux x64 GUI (zeeg)"
        type: boolean
        default: true
      build_macos_cli:
        description: "Build macOS Apple Silicon CLI (zee)"
        type: boolean
        default: true
      build_windows_arm64:
        description: "Build Windows ARM64 GUI (zee.exe)"
        type: boolean
        default: false
      build_linux_arm64:
        description: "Build Linux ARM64 (CLI & GUI)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

permissions:
  contents: write

jobs:
  determine-tag:
    name: Determine Target Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Tag
        id: get_tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target tag: ${TAG}"

  build-linux-gui:
    name: Build Linux x64 GUI
    if: inputs.build_linux_gui
    needs: determine-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold clang \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-xcb-dev \
            libvulkan-dev libasound2-dev libfontconfig1-dev pkg-config
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "extended-linux-x64-gui"
          cache-on-failure: true
      - name: Build & Package Linux GUI (zeeg)
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
        run: |
          TAG="${{ needs.determine-tag.outputs.tag }}"
          GUI_ARCHIVE="zee-${TAG}-linux-x64"
          cargo build --release -p zee-gui --target x86_64-unknown-linux-gnu
          mkdir -p "dist/${GUI_ARCHIVE}"
          cp "target/x86_64-unknown-linux-gnu/release/zeeg" "dist/${GUI_ARCHIVE}/"
          cp README.md MANUAL.md LICENSE* "dist/${GUI_ARCHIVE}/" 2>/dev/null || true
          cd dist
          zip -r "${GUI_ARCHIVE}.zip" "${GUI_ARCHIVE}"
          # Backwards-compatibility alias for v0.1.13 and earlier versions expecting zeeg-*
          cp "${GUI_ARCHIVE}.zip" "zeeg-${TAG}-linux-x64.zip"
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: dist/*.zip

  build-macos-cli:
    name: Build macOS ARM64 CLI
    if: inputs.build_macos_cli
    needs: determine-tag
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-macos-arm64"
          cache-on-failure: true
      - name: Build & Package macOS CLI (zee)
        run: |
          TAG="${{ needs.determine-tag.outputs.tag }}"
          CLI_ARCHIVE="zee-cli-${TAG}-macos-arm64"
          cargo build --release -p zee-tui --target aarch64-apple-darwin
          codesign --force --sign - "target/aarch64-apple-darwin/release/zee" || true
          mkdir -p "dist/${CLI_ARCHIVE}"
          cp "target/aarch64-apple-darwin/release/zee" "dist/${CLI_ARCHIVE}/"
          cp README.md MANUAL.md LICENSE* "dist/${CLI_ARCHIVE}/" 2>/dev/null || true
          cd dist
          zip -r "${CLI_ARCHIVE}.zip" "${CLI_ARCHIVE}"
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: dist/*.zip

  build-windows-arm64:
    name: Build Windows ARM64 GUI
    if: inputs.build_windows_arm64
    needs: determine-tag
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Optimize Windows build environment (Defender exclusion & lld-link)
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:RUNNER_TEMP"
          } catch {
            Write-Host "Skipping Defender exclusion: $_"
          }
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if (-not $lld -and (Test-Path "C:\Program Files\LLVM\bin\lld-link.exe")) {
            $lld = Get-Item "C:\Program Files\LLVM\bin\lld-link.exe"
          }
          if ($lld) {
            Write-Host "Using fast linker: $($lld.FullName)"
            "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$($lld.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "lld-link.exe not found; falling back to default MSVC link.exe"
          }
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: aarch64-pc-windows-msvc
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          shared-key: "extended-windows-arm64"
          cache-on-failure: true
      - name: Build & Package Windows ARM64 GUI
        shell: bash
        run: |
          TAG="${{ needs.determine-tag.outputs.tag }}"
          GUI_ARCHIVE="zee-${TAG}-windows-arm64"
          cargo build --release -p zee-gui --target aarch64-pc-windows-msvc
          mkdir -p "dist/${GUI_ARCHIVE}"
          cp "target/aarch64-pc-windows-msvc/release/zeeg.exe" "dist/${GUI_ARCHIVE}/zee.exe"
          cp README.md MANUAL.md LICENSE* "dist/${GUI_ARCHIVE}/" 2>/dev/null || true
          cd dist
          7z a "${GUI_ARCHIVE}.zip" "${GUI_ARCHIVE}"
          # Backwards-compatibility alias for v0.1.13 and earlier versions expecting zeeg-*
          cp "${GUI_ARCHIVE}.zip" "zeeg-${TAG}-windows-arm64.zip"
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: dist/*.zip

  build-linux-arm64:
    name: Build Linux ARM64 (CLI & GUI)
    if: inputs.build_linux_arm64
    needs: determine-tag
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold clang \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-xcb-dev \
            libvulkan-dev libasound2-dev libfontconfig1-dev pkg-config
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "extended-linux-arm64"
          cache-on-failure: true
      - name: Build & Package Linux ARM64
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
        run: |
          TAG="${{ needs.determine-tag.outputs.tag }}"
          CLI_ARCHIVE="zee-cli-${TAG}-linux-arm64"
          GUI_ARCHIVE="zee-${TAG}-linux-arm64"
          cargo build --release -p zee-tui -p zee-gui --target aarch64-unknown-linux-gnu
          mkdir -p "dist/${CLI_ARCHIVE}"
          cp "target/aarch64-unknown-linux-gnu/release/zee" "dist/${CLI_ARCHIVE}/"
          mkdir -p "dist/${GUI_ARCHIVE}"
          cp "target/aarch64-unknown-linux-gnu/release/zeeg" "dist/${GUI_ARCHIVE}/"
          cd dist
          zip -r "${CLI_ARCHIVE}.zip" "${CLI_ARCHIVE}"
          zip -r "${GUI_ARCHIVE}.zip" "${GUI_ARCHIVE}"
          # Backwards-compatibility alias for v0.1.13 and earlier versions expecting zeeg-*
          cp "${GUI_ARCHIVE}.zip" "zeeg-${TAG}-linux-arm64.zip"
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: dist/*.zip

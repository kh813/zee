name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. macOS: Apple Silicon GUI (Zee.app)
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            is_macos: true
            platform: macos-arm64
          # 2. Linux: x86_64 CLI (zee & zee-cli) - Ultra-fast build without GUI dependencies
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_linux: true
            platform: linux-x64
          # 3. Linux Desktop: x86_64 Dual GUI/CLI (zee & zee-cli)
          - name: linux-desktop-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_linux_desktop: true
            platform: linux-desktop-x64
          # 4. Windows: x86_64 GUI (zee.exe)
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true
            platform: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --- macOS: GUI only (Zee.app) ---
      - name: Build & Package macOS GUI (Zee.app)
        if: matrix.is_macos
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          VERSION="${TAG_NAME#v}"
          GUI_ARCHIVE_NAME="zee-${TAG_NAME}-${{ matrix.platform }}"
          cargo build --release -p zee-gui --bin zeeg --target ${{ matrix.target }}
          mkdir -p dist/Zee.app/Contents/MacOS
          mkdir -p dist/Zee.app/Contents/Resources
          cp "target/${{ matrix.target }}/release/zeeg" dist/Zee.app/Contents/MacOS/zeeg
          chmod +x dist/Zee.app/Contents/MacOS/zeeg
          if [ -f assets/icons/zee.icns ]; then cp assets/icons/zee.icns dist/Zee.app/Contents/Resources/zee.icns; fi
          cat << EOF > dist/Zee.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>zeeg</string>
              <key>CFBundleIdentifier</key>
              <string>dev.hiroshi.zeeg</string>
              <key>CFBundleName</key>
              <string>zee</string>
              <key>CFBundleDisplayName</key>
              <string>zee</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleIconFile</key>
              <string>zee.icns</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key>
                      <string>All Files</string>
                      <key>CFBundleTypeRole</key>
                      <string>Editor</string>
                      <key>LSItemContentTypes</key>
                      <array>
                          <string>public.data</string>
                          <string>public.content</string>
                          <string>public.plain-text</string>
                      </array>
                  </dict>
              </array>
              <key>LSMinimumSystemVersion</key>
              <string>10.15.7</string>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "dist/Zee.app" || true
          cd dist
          zip -r "${GUI_ARCHIVE_NAME}.zip" Zee.app
          cd ..

      # --- Linux: CLI only (zee & zee-cli) ---
      - name: Build Linux CLI (zee & zee-cli)
        if: matrix.is_linux
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          ARCHIVE_NAME="zee-cli-${TAG_NAME}-${{ matrix.platform }}"
          cargo build --release -p zee-tui --bin zee --target ${{ matrix.target }}
          cargo build --release -p zee-tui --bin zee-cli --target ${{ matrix.target }}
          
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/zee" "dist/${ARCHIVE_NAME}/"
          cp "target/${{ matrix.target }}/release/zee-cli" "dist/${ARCHIVE_NAME}/"
          cp README.md MANUAL.md LICENSE* "dist/${ARCHIVE_NAME}/" 2>/dev/null || true
          cd dist
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          cd ..

      # --- Linux Desktop: Dual GUI/CLI (zee, zee-cli, zeeg) ---
      - name: Install Linux Desktop build dependencies
        if: matrix.is_linux_desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libasound2-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Build Linux Desktop (zee dual & zee-cli)
        if: matrix.is_linux_desktop
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          ARCHIVE_NAME="zee-desktop-${TAG_NAME}-${{ matrix.platform }}"
          cargo build --release -p zee-gui --bin zee --target ${{ matrix.target }}
          cargo build --release -p zee-gui --bin zeeg --target ${{ matrix.target }}
          cargo build --release -p zee-tui --bin zee-cli --target ${{ matrix.target }}
          
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/zee" "dist/${ARCHIVE_NAME}/zee"
          cp "target/${{ matrix.target }}/release/zeeg" "dist/${ARCHIVE_NAME}/zeeg"
          cp "target/${{ matrix.target }}/release/zee-cli" "dist/${ARCHIVE_NAME}/zee-cli"
          if [ -f assets/icons/zee.png ]; then cp assets/icons/zee.png "dist/${ARCHIVE_NAME}/"; fi
          
          cat << 'EOF' > "dist/${ARCHIVE_NAME}/zee.desktop"
          [Desktop Entry]
          Name=zee
          Comment=Fast, modern, lightweight text editor
          Exec=zee --gui %F
          Terminal=false
          Type=Application
          Icon=zee
          Categories=Utility;TextEditor;Development;
          MimeType=text/plain;text/markdown;text/x-rust;
          EOF

          cp README.md MANUAL.md LICENSE* "dist/${ARCHIVE_NAME}/" 2>/dev/null || true
          cd dist
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          cd ..

      # --- Windows: GUI only (zee.exe) ---
      - name: Build Windows GUI (zee.exe)
        if: matrix.is_windows
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          GUI_ARCHIVE_NAME="zee-${TAG_NAME}-${{ matrix.platform }}"
          cargo build --release -p zee-gui --bin zeeg --target ${{ matrix.target }}

          mkdir -p "dist/${GUI_ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/zeeg.exe" "dist/${GUI_ARCHIVE_NAME}/zee.exe"
          cp README.md MANUAL.md LICENSE* "dist/${GUI_ARCHIVE_NAME}/" 2>/dev/null || true

          cd dist
          7z a "${GUI_ARCHIVE_NAME}.zip" "${GUI_ARCHIVE_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

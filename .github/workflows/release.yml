name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create & publish from main (e.g. v0.3.15). Leave empty to only warm main release cache."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.0-cache' }}

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. macOS: Apple Silicon GUI (Zee.app)
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            is_macos: true
            platform: macos-arm64
          # 2. Linux: x86_64 CLI (zee & zee-cli)
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_linux: true
            platform: linux-x64
          # 3. Windows: x86_64 GUI (zee.exe)
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true
            platform: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optimize Windows build environment (Defender exclusion & lld-link)
        if: matrix.is_windows
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:RUNNER_TEMP"
          } catch {
            Write-Host "Skipping Defender exclusion: $_"
          }
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if (-not $lld -and (Test-Path "C:\Program Files\LLVM\bin\lld-link.exe")) {
            $lld = Get-Item "C:\Program Files\LLVM\bin\lld-link.exe"
          }
          if ($lld) {
            Write-Host "Using fast linker: $($lld.FullName)"
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$($lld.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "lld-link.exe not found; falling back to default MSVC link.exe"
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          shared-key: "release-${{ matrix.name }}"
          cache-on-failure: true

      # --- macOS: GUI (Zee.app) & CLI (zee) ---
      - name: Build & Package macOS GUI (Zee.app) and CLI (zee)
        if: matrix.is_macos
        run: |
          TAG_NAME="${RELEASE_TAG:-v0.1.0}"
          VERSION="${TAG_NAME#v}"
          GUI_ARCHIVE_NAME="zee-${TAG_NAME}-${{ matrix.platform }}"
          CLI_ARCHIVE_NAME="zee-cli-${TAG_NAME}-${{ matrix.platform }}"
          cargo build --release -p zee-gui --bin zeeg -p zee-tui --bin zee --target ${{ matrix.target }}
          mkdir -p dist/Zee.app/Contents/MacOS
          mkdir -p dist/Zee.app/Contents/Resources
          cp "target/${{ matrix.target }}/release/zeeg" dist/Zee.app/Contents/MacOS/zeeg
          chmod +x dist/Zee.app/Contents/MacOS/zeeg
          if [ -f assets/icons/zee.icns ]; then cp assets/icons/zee.icns dist/Zee.app/Contents/Resources/zee.icns; fi
          cat << EOF > dist/Zee.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>zeeg</string>
              <key>CFBundleIdentifier</key>
              <string>dev.hiroshi.zeeg</string>
              <key>CFBundleName</key>
              <string>zee</string>
              <key>CFBundleDisplayName</key>
              <string>zee</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleIconFile</key>
              <string>zee.icns</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>LSMultipleInstancesProhibited</key>
              <true/>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key>
                      <string>All Files</string>
                      <key>CFBundleTypeRole</key>
                      <string>Editor</string>
                      <key>LSItemContentTypes</key>
                      <array>
                          <string>public.data</string>
                          <string>public.content</string>
                          <string>public.plain-text</string>
                      </array>
                  </dict>
              </array>
              <key>LSMinimumSystemVersion</key>
              <string>10.15.7</string>
              <key>CFBundleLocalizations</key>
              <array>
                  <string>en</string>
                  <string>ja</string>
                  <string>zh-CN</string>
                  <string>zh-TW</string>
                  <string>ko</string>
                  <string>es</string>
                  <string>fr</string>
                  <string>de</string>
                  <string>it</string>
                  <string>pt</string>
                  <string>ru</string>
              </array>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "dist/Zee.app" || true
          codesign --force --sign - "target/${{ matrix.target }}/release/zee" || true
          mkdir -p "dist/${CLI_ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/zee" "dist/${CLI_ARCHIVE_NAME}/"
          cp README.md MANUAL.md LICENSE* "dist/${CLI_ARCHIVE_NAME}/" 2>/dev/null || true
          cd dist
          zip -r "${GUI_ARCHIVE_NAME}.zip" Zee.app
          zip -r "${CLI_ARCHIVE_NAME}.zip" "${CLI_ARCHIVE_NAME}"
          cd ..

      # --- Linux: CLI only (zee) ---
      - name: Install mold linker (Linux)
        if: matrix.is_linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold clang

      - name: Build Linux CLI (zee)
        if: matrix.is_linux
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
        run: |
          TAG_NAME="${RELEASE_TAG:-v0.1.0}"
          ARCHIVE_NAME="zee-cli-${TAG_NAME}-${{ matrix.platform }}"
          cargo build --release -p zee-tui --bin zee --target ${{ matrix.target }}
          strip "target/${{ matrix.target }}/release/zee"
          
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/zee" "dist/${ARCHIVE_NAME}/"
          cp README.md MANUAL.md LICENSE* "dist/${ARCHIVE_NAME}/" 2>/dev/null || true
          cd dist
          zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          cd ..

      # --- Windows: GUI only (zee.exe) ---
      - name: Build Windows GUI (zee.exe)
        if: matrix.is_windows
        shell: bash
        run: |
          TAG_NAME="${RELEASE_TAG:-v0.1.0}"
          GUI_ARCHIVE_NAME="zee-${TAG_NAME}-${{ matrix.platform }}"
          cargo build --release -p zee-gui --bin zeeg --target ${{ matrix.target }}

          mkdir -p "dist/${GUI_ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/zeeg.exe" "dist/${GUI_ARCHIVE_NAME}/zee.exe"
          cp README.md MANUAL.md LICENSE* "dist/${GUI_ARCHIVE_NAME}/" 2>/dev/null || true

          cd dist
          7z a "${GUI_ARCHIVE_NAME}.zip" "${GUI_ARCHIVE_NAME}"

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            dist/*.zip

  publish-release:
    name: Publish Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: Deep dark tech obsidian -->
    <linearGradient id="bg1b_crisp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26"/>
      <stop offset="50%" stop-color="#10131b"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Crisp Left Bracket: Vibrant Electric Cyan -->
    <linearGradient id="bracketCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>

    <!-- Crisp Right Bracket: Vibrant Neon Coral / Orange -->
    <linearGradient id="bracketCoral" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff7b39"/>
    </linearGradient>

    <!-- Center Diagonal Slash forming Z: Pure Crisp Bright Blade -->
    <linearGradient id="slashWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2ecff"/>
      <stop offset="100%" stop-color="#70a1ff"/>
    </linearGradient>

    <!-- macOS Squircle Clip -->
    <clipPath id="squircle">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
  </defs>

  <!-- Outer Squircle with Solid Dimensional Edge Shadow (No blur) -->
  <!-- Subtle bottom drop rim for macOS icon depth -->
  <rect x="64" y="80" width="896" height="896" rx="200" fill="#030407" opacity="0.6"/>
  <!-- Main Icon Plate -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg1b_crisp)"/>
  <!-- Crisp High-Tech Bevel Border -->
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#283248" stroke-width="4"/>
  <rect x="70" y="70" width="884" height="884" rx="194" fill="none" stroke="#000000" stroke-width="2" opacity="0.4"/>

  <!-- Icon Graphic Contents (Crisp, High Contrast, Vector Geometric) -->
  <g clip-path="url(#squircle)">
    <!-- Subtle interior code grid line indicators (very crisp, low opacity) -->
    <line x1="210" y1="200" x2="210" y2="824" stroke="#ffffff" stroke-width="2" opacity="0.05"/>
    <line x1="814" y1="200" x2="814" y2="824" stroke="#ffffff" stroke-width="2" opacity="0.05"/>

    <!-- LEFT BRACKET '{' : Solid, bold (stroke-width 56) with crisp rounded ends -->
    <path d="M 430 250 
             L 330 250 
             A 64 64 0 0 0 266 314 
             L 266 452 
             A 54 54 0 0 1 212 506 
             A 54 54 0 0 1 266 560 
             L 266 698 
             A 64 64 0 0 0 330 762 
             L 430 762"
          fill="none" 
          stroke="url(#bracketCyan)" 
          stroke-width="56" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- RIGHT BRACKET '}' : Solid, bold (stroke-width 56) with crisp rounded ends -->
    <path d="M 594 250 
             L 694 250 
             A 64 64 0 0 1 758 314 
             L 758 452 
             A 54 54 0 0 0 812 506 
             A 54 54 0 0 0 758 560 
             L 758 698 
             A 64 64 0 0 1 694 762 
             L 594 762"
          fill="none" 
          stroke="url(#bracketCoral)" 
          stroke-width="56" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- DIAGONAL SLASH: Crisp solid white-to-blue core connecting brackets into Z -->
    <!-- Under-shadow line for physical depth/contrast against brackets -->
    <path d="M 700 292 L 324 720" 
          fill="none" 
          stroke="#0a0c14" 
          stroke-width="72" 
          stroke-linecap="round"/>
          
    <!-- Main Blade Line -->
    <path d="M 700 292 L 324 720" 
          fill="none" 
          stroke="url(#slashWhite)" 
          stroke-width="58" 
          stroke-linecap="round"/>
  </g>
</svg>

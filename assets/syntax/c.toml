[meta]
name = "C"
extensions = ["c", "h"]

[[rule]]
token = "attribute"
pattern = "#\\s*(include|define|undef|if|ifdef|ifndef|elif|else|endif|error|pragma|line).*"

[[rule]]
token = "keyword"
pattern = "auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while|_Bool|_Complex|_Imaginary"
word_boundary = true

[[rule]]
token = "type_name"
pattern = "size_t|ssize_t|int8_t|int16_t|int32_t|int64_t|uint8_t|uint16_t|uint32_t|uint64_t|intptr_t|uintptr_t|FILE|bool"
word_boundary = true

[[rule]]
token = "constant"
pattern = "NULL|true|false"
word_boundary = true

[[rule]]
token = "number"
pattern = "0x[0-9a-fA-F]+|[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+)?[fFlLuU]*"
word_boundary = true

[[rule]]
token = "string"
pattern = "\".*?\""

[[rule]]
token = "string"
pattern = "'.*?'"

[[rule]]
token = "comment"
pattern = "//.*"

[[rule]]
token = "comment"
start = "/\\*"
end = "\\*/"

[[rule]]
token = "function"
pattern = "[a-zA-Z_][a-zA-Z0-9_]*\\s*\\("

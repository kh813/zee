[meta]
name = "C++"
extensions = ["cpp", "hpp", "cc", "cxx", "c++", "hh", "hxx"]

[[rule]]
token = "attribute"
pattern = "#\\s*(include|define|undef|if|ifdef|ifndef|elif|else|endif|error|pragma|line).*"

[[rule]]
token = "keyword"
pattern = "alignas|alignof|and|and_eq|asm|atomic_cancel|atomic_commit|atomic_noexcept|auto|bitand|bitor|bool|break|case|catch|char|char8_t|char16_t|char32_t|class|compl|concept|const|consteval|constexpr|constinit|const_cast|continue|co_await|co_return|co_yield|decltype|default|delete|do|double|dynamic_cast|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|not|not_eq|nullptr|operator|or|or_eq|private|protected|public|reflexpr|register|reinterpret_cast|requires|return|short|signed|sizeof|static|static_assert|static_cast|struct|switch|synchronized|template|this|thread_local|throw|true|try|typedef|typeid|typename|union|unsigned|using|virtual|void|volatile|wchar_t|while|xor|xor_eq|final|override"
word_boundary = true

[[rule]]
token = "type_name"
pattern = "std::string|std::vector|std::map|std::unordered_map|std::set|std::unordered_set|std::pair|std::tuple|std::unique_ptr|std::shared_ptr|std::weak_ptr|std::optional|std::variant|std::any|size_t|int8_t|int16_t|int32_t|int64_t|uint8_t|uint16_t|uint32_t|uint64_t"
word_boundary = true

[[rule]]
token = "constant"
pattern = "nullptr|NULL|true|false"
word_boundary = true

[[rule]]
token = "number"
pattern = "0x[0-9a-fA-F]+|[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+)?[fFlLuU]*"
word_boundary = true

[[rule]]
token = "string"
pattern = "\".*?\""

[[rule]]
token = "string"
pattern = "'.*?'"

[[rule]]
token = "comment"
pattern = "//.*"

[[rule]]
token = "comment"
start = "/\\*"
end = "\\*/"

[[rule]]
token = "function"
pattern = "[a-zA-Z_][a-zA-Z0-9_]*\\s*\\("

[[rule]]
token = "operator"
pattern = "::|->|<<|>>|<=|>=|==|!=|&&|\\|\\||[+\\-*/%&|^!~=<>?:]"

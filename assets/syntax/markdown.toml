[meta]
name = "Markdown"
extensions = ["md", "markdown"]
block_comment = ["<!--", "-->"]

[[rule]]
token = "heading6"
pattern = "^######.*"

[[rule]]
token = "heading5"
pattern = "^#####.*"

[[rule]]
token = "heading4"
pattern = "^####.*"

[[rule]]
token = "heading3"
pattern = "^###.*"

[[rule]]
token = "heading2"
pattern = "^##.*"

[[rule]]
token = "heading1"
pattern = "^#.*"

[[rule]]
token = "list_marker"
pattern = "^[ \\t]*([*\\-+]|\\d+\\.)[ \\t]"

[[rule]]
token = "bold"
pattern = "\\*\\*[^\\*\\r\\n]+?\\*\\*"

[[rule]]
token = "attribute"
pattern = "\\*.*\\*"

[[rule]]
token = "inline_code"
pattern = "`+[^`\\r\\n]+`+"

[[rule]]
token = "code_block"
start = "^[ \\t]*`{6,}[^`\\r\\n]*\\r?\\n?$"
end = "^[ \\t]*`{6,}[ \\t]*\\r?\\n?$"

[[rule]]
token = "code_block"
start = "^[ \\t]*`{5}[^`\\r\\n]*\\r?\\n?$"
end = "^[ \\t]*`{5,}[ \\t]*\\r?\\n?$"

[[rule]]
token = "code_block"
start = "^[ \\t]*`{4}[^`\\r\\n]*\\r?\\n?$"
end = "^[ \\t]*`{4,}[ \\t]*\\r?\\n?$"

[[rule]]
token = "code_block"
start = "^[ \\t]*`{3}[^`\\r\\n]*\\r?\\n?$"
end = "^[ \\t]*`{3,}[ \\t]*\\r?\\n?$"

[[rule]]
token = "link"
pattern = "\\[.*\\]\\(.*\\)"

[meta]
name = "Markdown"
extensions = ["md", "markdown"]
block_comment = ["<!--", "-->"]

[[rule]]
token = "heading6"
pattern = "^######.*"

[[rule]]
token = "heading5"
pattern = "^#####.*"

[[rule]]
token = "heading4"
pattern = "^####.*"

[[rule]]
token = "heading3"
pattern = "^###.*"

[[rule]]
token = "heading2"
pattern = "^##.*"

[[rule]]
token = "heading1"
pattern = "^#.*"

[[rule]]
token = "type_name"
pattern = "\\*\\*.*\\*\\*"

[[rule]]
token = "attribute"
pattern = "\\*.*\\*"

[[rule]]
token = "string"
pattern = "`[^`]+`"

[[rule]]
token = "constant"
start = "```"
end = "```"

[[rule]]
token = "function"
pattern = "\\[.*\\]\\(.*\\)"

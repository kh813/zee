[meta]
name = "Markdown"
extensions = ["md", "markdown"]
block_comment = ["<!--", "-->"]

[[rule]]
token = "heading6"
pattern = "^######.*"

[[rule]]
token = "heading5"
pattern = "^#####.*"

[[rule]]
token = "heading4"
pattern = "^####.*"

[[rule]]
token = "heading3"
pattern = "^###.*"

[[rule]]
token = "heading2"
pattern = "^##.*"

[[rule]]
token = "heading1"
pattern = "^#.*"

[[rule]]
token = "list_marker"
pattern = "^[ \\t]*([*\\-+]|\\d+\\.)[ \\t]"

[[rule]]
token = "bold"
pattern = "\\*\\*[^\\*\\r\\n]+?\\*\\*"

[[rule]]
token = "attribute"
pattern = "\\*.*\\*"

[[rule]]
token = "inline_code"
pattern = "`[^`]+`"

[[rule]]
token = "keyword"
start = "```"
end = "```"

[[rule]]
token = "link"
pattern = "\\[.*\\]\\(.*\\)"

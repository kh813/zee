[meta]
name = "Python"
extensions = ["py"]
line_comment = "#"

[[rule]]
token = "keyword"
pattern = "and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield"
word_boundary = true

[[rule]]
token = "constant"
pattern = "True|False|None"
word_boundary = true

[[rule]]
token = "comment"
start = "\"\"\""
end = "\"\"\""
escape = "\\"

[[rule]]
token = "comment"
start = "'''"
end = "'''"
escape = "\\"

[[rule]]
token = "string"
pattern = "\"[^\"\\\\\\r\\n]*(?:\\\\.[^\"\\\\\\r\\n]*)*\""

[[rule]]
token = "string"
pattern = "'[^'\\\\\\r\\n]*(?:\\\\.[^'\\\\\\r\\n]*)*'"

[[rule]]
token = "comment"
pattern = "#.*"

[[rule]]
token = "function"
pattern = "[a-zA-Z_][a-zA-Z0-9_]*\\s*\\("

[[rule]]
token = "attribute"
pattern = "@[a-zA-Z_][a-zA-Z0-9_]*"

[meta]
name = "YAML"
extensions = ["yaml", "yml"]

[[rule]]
token = "comment"
pattern = "#.*"

[[rule]]
token = "constant"
pattern = "true|false|yes|no|on|off|null|~"
word_boundary = true

[[rule]]
token = "string"
pattern = "\".*?\""

[[rule]]
token = "string"
pattern = "'.*?'"

[[rule]]
token = "type_name"
pattern = "[a-zA-Z0-9_-]+:"

[[rule]]
token = "attribute"
pattern = "(&|\\*)[a-zA-Z0-9_-]+|![a-zA-Z0-9_/-]+"

[[rule]]
token = "number"
pattern = "[0-9]+(\\.[0-9]+)?"
word_boundary = true

[[rule]]
token = "operator"
pattern = "---|\\.\\.\\.|[\\-:>\\[\\]{},?]"

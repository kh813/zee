[package]
name = "zee-gui"
version = "0.1.9"
edition = "2021"

[[bin]]
name = "zeeg"
path = "src/main.rs"

[dependencies]
zee-core = { path = "../zee-core" }
gpui          = { git = "https://github.com/zed-industries/zed", rev = "6766514599c6f8ce6530ccc685db5e0d68c44f32" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6766514599c6f8ce6530ccc685db5e0d68c44f32", features = ["font-kit"] }
anyhow   = { workspace = true }
serde    = { workspace = true }
serde_json = "1.0.149"
rfd = "0.15"
url = "2.5"
futures = "0.3"
smol = "2.0"
unicode-width = { workspace = true }

[build-dependencies]
winres = "0.1"
